<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo gửi hàng</title>
<script>
  // ====== DÁN ĐỊA CHỈ ỨNG DỤNG WEB (đuôi /exec) VÀO GIỮA 2 DẤU NHÁY DƯỚI ĐÂY ======
  const EXEC = 'https://script.google.com/macros/s/……/exec';
  // ==================================================================================
</script>
<style>
 body{font-family:Arial,Helvetica,sans-serif;margin:16px;color:#222;max-width:560px}
 h2{margin:0 0 4px;color:#1f4e79}.s{color:#444;margin:3px 0}
 .dc{background:#f3f6fa;padding:8px;border-radius:8px;font-size:14px;white-space:pre-wrap}
 .b{display:block;width:100%;padding:13px;margin:7px 0;font-size:16px;border:1px solid #1f4e79;border-radius:10px;background:#fff;color:#1f4e79}
 .b.on{background:#1f4e79;color:#fff}
 input{font-size:16px;padding:10px;width:100%;box-sizing:border-box;margin:4px 0}
 #go{background:#2e7d32;color:#fff;border:none;margin-top:16px}#go:disabled{opacity:.6}
 .note{background:#fff3cd;padding:8px;border-radius:8px}.err{color:#c00}
 #ok{display:none;text-align:center;font-size:19px;color:#2e7d32;margin-top:30px}
 .muted{color:#888;font-size:14px}
</style></head>
<body>
<div id="f">
 <h2 id="so"></h2>
 <div id="info" class="muted">Đang tải thông tin đơn…</div>
 <p class="note" id="daGui" style="display:none"></p>
 <p><b>Hình thức gửi:</b></p><div id="btns"></div>
 <div id="lk" style="display:none"><p><b>Dán link hành trình:</b></p><input id="l" placeholder="Dán link chia sẻ chuyến xe"></div>
 <p><b>Người gửi:</b></p><input id="n" placeholder="Tên bạn">
 <p><b>Ảnh gửi hàng</b><span id="tuyChon"></span>:</p><input id="p" type="file" accept="image/*">
 <button class="b" id="go" onclick="gui()">✅ XÁC NHẬN ĐÃ GỬI</button>
</div>
<div id="ok">✅ Đã ghi nhận <span id="so2"></span><br><small id="kq"></small><br><small>Bạn có thể đóng trang này.</small></div>
<script>
 const HT = ['Viettel Post','GHTK','Nhà xe','PCS','Xe công nghệ (Grab/Be/Xanh SM)','Xe công ty','Khách tự lấy','Khác'];
 const XE = 4, GO = '✅ XÁC NHẬN ĐÃ GỬI';
 const q = new URLSearchParams(location.search), D = q.get('d') || '', T = q.get('t') || '';
 let ht = -1, daGui = false;
 const $ = id => document.getElementById(id);
 const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 $('so').textContent = D; $('so2').textContent = D;
 $('btns').innerHTML = HT.map((h, i) => '<button class="b" data-i="' + i + '" onclick="chon(this)">' + esc(h) + '</button>').join('');
 try { $('n').value = localStorage.getItem('ten') || ''; } catch (e) {}

 function chon(b) {
   document.querySelectorAll('#btns .b').forEach(x => x.classList.remove('on'));
   b.classList.add('on'); ht = +b.getAttribute('data-i');
   $('lk').style.display = ht === XE ? 'block' : 'none';
 }

 // Tải thông tin đơn (chạy nền, nút bấm dùng được ngay)
 fetch(EXEC + '?api=info&d=' + encodeURIComponent(D) + '&t=' + encodeURIComponent(T))
   .then(r => r.json()).then(o => {
     if (!o.ok) { $('info').innerHTML = '<p class="err">' + esc(o.err) + '</p>'; $('go').disabled = true; return; }
     $('info').className = '';
     $('info').innerHTML = '<div class="s"><b>' + esc(o.kho) + '</b> · Sale: ' + esc(o.sale) + '</div>' +
       '<div class="s">' + esc(o.khach) + '</div>' +
       (o.sdt ? '<div class="s">SĐT: <a href="tel:' + esc(o.sdt) + '">' + esc(o.sdt) + '</a></div>' : '') +
       (o.diaChi ? '<div class="s dc">' + esc(o.diaChi) + '</div>' : '');
     daGui = !!o.daGui;
     if (daGui) {
       $('daGui').style.display = 'block';
       $('daGui').innerHTML = '⚠️ Đã báo gửi lúc ' + esc(o.gio) + ' · ' + esc(o.hinhThuc) + ' · ' + esc(o.nguoi) +
         '.<br>Xác nhận lại sẽ cập nhật (có thể chỉ thêm link hành trình).';
       $('tuyChon').textContent = ' (không bắt buộc khi chỉ cập nhật)';
       const i = HT.indexOf(o.hinhThuc);
       if (i >= 0 && ht < 0) chon(document.querySelector('[data-i="' + i + '"]'));
       if (o.linkHT && !$('l').value) $('l').value = o.linkHT;
       if (!$('n').value) $('n').value = o.nguoi || '';
     }
   }).catch(() => { $('info').textContent = '(Chưa tải được thông tin đơn – vẫn báo gửi được bình thường)'; });

 function nen(file, cb) {
   const r = new FileReader();
   r.onload = () => { const i = new Image();
     i.onload = () => { const m = 1600, k = Math.min(1, m / Math.max(i.width, i.height));
       const c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k;
       c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.8).split(',')[1]); };
     i.onerror = () => { alert('Không đọc được ảnh, chọn ảnh khác'); reset(); };
     i.src = r.result; };
   r.readAsDataURL(file);
 }
 function reset() { $('go').disabled = false; $('go').textContent = GO; }

 function gui() {
   if (ht < 0) { alert('Chọn hình thức gửi'); return; }
   const n = $('n').value.trim(); if (!n) { alert('Nhập tên người gửi'); return; }
   try { localStorage.setItem('ten', n); } catch (e) {}
   const l = ht === XE ? $('l').value.trim() : '';
   const f = $('p').files[0];
   if (!f && !daGui && !confirm('Chưa chọn ảnh gửi hàng. Vẫn xác nhận?')) return;
   $('go').disabled = true; $('go').textContent = 'Đang lưu…';
   const send = a => fetch(EXEC + '?api=gui', { method: 'POST', body: JSON.stringify({ d: D, t: T, i: ht, n: n, a: a || '', l: l }) })
     .then(r => r.json()).then(o => {
       if (!o.ok) { alert('Lỗi: ' + o.err); reset(); return; }
       $('f').style.display = 'none'; $('kq').textContent = o.msg || ''; $('ok').style.display = 'block';
     }).catch(e => { alert('Không gửi được, kiểm tra mạng rồi bấm lại. (' + e.message + ')'); reset(); });
   if (f) nen(f, send); else send('');
 }
</script>
</body></html>
