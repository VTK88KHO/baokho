<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo gửi hàng</title>
<script>
  // ====== DÁN ĐỊA CHỈ ỨNG DỤNG WEB (đuôi /exec) VÀO GIỮA 2 DẤU NHÁY DƯỚI ĐÂY ======
  const EXEC = 'https://script.google.com/macros/s/AKfycbxI9CVj0JOr1b4iL-yrHgl7LARdFPydrNWPYrasDYnBSE02fB2ZHD6nYHvaVju7ezYB/exec';
  // ==================================================================================
</script>
<style>
 body{font-family:Arial,Helvetica,sans-serif;margin:16px;color:#222;max-width:560px}
 h2{margin:0 0 4px;color:#1f4e79}.s{color:#444;margin:3px 0}
 .dc{background:#f3f6fa;padding:8px;border-radius:8px;font-size:14px;white-space:pre-wrap}
 .b{display:block;width:100%;padding:13px;margin:7px 0;font-size:16px;border:1px solid #1f4e79;border-radius:10px;background:#fff;color:#1f4e79}
 .b.on{background:#1f4e79;color:#fff}
 input,textarea{font-size:16px;padding:10px;width:100%;box-sizing:border-box;margin:4px 0;font-family:inherit}
 #go{background:#2e7d32;color:#fff;border:none;margin-top:16px}#go:disabled{opacity:.6}
 .note{background:#fff3cd;padding:8px;border-radius:8px}.err{color:#c00}
 #ok{display:none;text-align:center;font-size:19px;color:#2e7d32;margin-top:30px}
 .muted{color:#888;font-size:14px}
 #thumbs{display:flex;gap:8px;flex-wrap:wrap}#thumbs div{position:relative}
 #thumbs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid #ccc;display:block}
 #thumbs span{position:absolute;top:-6px;right:-6px;background:#c00;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:13px;cursor:pointer}
 label.b{box-sizing:border-box;cursor:pointer}#huy:disabled{opacity:.6}
</style></head>
<body>
<div id="f">
 <h2 id="so"></h2>
 <div id="info" class="muted">Đang tải thông tin đơn…</div>
 <p class="note" id="daGui" style="display:none"></p>
 <p><b>Hình thức gửi:</b></p><div id="btns"></div>
 <div id="lk" style="display:none"><p><b>Dán link hành trình:</b></p><input id="l" placeholder="Dán link chia sẻ chuyến xe"></div>
 <p><b>Người gửi:</b></p><input id="n" placeholder="Tên bạn">
 <p><b>Ghi chú</b> (không bắt buộc):</p><textarea id="g" rows="3" placeholder="VD: SĐT ship 09xx…, hàng gửi 2 kiện, khách hẹn chiều…"></textarea>
 <p><b>Ảnh gửi hàng</b> (tối đa 3 ảnh)<span id="tuyChon"></span>:</p>
 <div id="thumbs"></div>
 <label class="b" id="themAnh" for="p" style="text-align:center">📷 Chọn ảnh</label>
 <input id="p" type="file" accept="image/*" multiple style="display:none" onchange="themAnh(this)">
 <button class="b" id="go" onclick="gui()">✅ XÁC NHẬN ĐÃ GỬI</button>
 <button class="b" id="huy" style="display:none;border-color:#c00;color:#c00;margin-top:18px" onclick="huy()">↩️ Báo nhầm – hủy xác nhận</button>
</div>
<div id="ok">✅ Đã ghi nhận <span id="so2"></span><br><small id="kq"></small><br><small>Bạn có thể đóng trang này.</small></div>
<script>
 const HT = ['Viettel Post','GHTK','Nhà xe','PCS','Xe công nghệ (Grab/Be/Xanh SM)','Xe công ty','Khách tự lấy','Khác'];
 const XE = 4, GO = '✅ XÁC NHẬN ĐÃ GỬI';
 const q = new URLSearchParams(location.search), D = q.get('d') || '', T = q.get('t') || '';
 let ht = -1, daGui = false;
 const $ = id => document.getElementById(id);
 const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 $('so').textContent = D; $('so2').textContent = D;
 $('btns').innerHTML = HT.map((h, i) => '<button class="b" data-i="' + i + '" onclick="chon(this)">' + esc(h) + '</button>').join('');
 try { $('n').value = localStorage.getItem('ten') || ''; } catch (e) {}

 function chon(b) {
   document.querySelectorAll('#btns .b').forEach(x => x.classList.remove('on'));
   b.classList.add('on'); ht = +b.getAttribute('data-i');
   $('lk').style.display = ht === XE ? 'block' : 'none';
 }

 // Tải thông tin đơn (chạy nền, nút bấm dùng được ngay)
 fetch(EXEC + '?api=info&d=' + encodeURIComponent(D) + '&t=' + encodeURIComponent(T))
   .then(r => r.json()).then(o => {
     if (!o.ok) { $('info').innerHTML = '<p class="err">' + esc(o.err) + '</p>'; $('go').disabled = true; return; }
     $('info').className = '';
     $('info').innerHTML = '<div class="s"><b>' + esc(o.kho) + '</b> · Sale: ' + esc(o.sale) + '</div>' +
       '<div class="s">' + esc(o.khach) + '</div>' +
       (o.sdt ? '<div class="s">SĐT: <a href="tel:' + esc(o.sdt) + '">' + esc(o.sdt) + '</a></div>' : '') +
       (o.diaChi ? '<div class="s dc">' + esc(o.diaChi) + '</div>' : '');
     daGui = !!o.daGui;
     if (daGui) {
       $('daGui').style.display = 'block';
       $('daGui').innerHTML = '⚠️ Đã báo gửi lúc ' + esc(o.gio) + ' · ' + esc(o.hinhThuc) + ' · ' + esc(o.nguoi) +
         '.<br>Xác nhận lại sẽ cập nhật (có thể chỉ thêm link hành trình).';
       $('tuyChon').textContent = ' (chọn ảnh mới nếu ảnh trước bị nhầm)';
       $('huy').style.display = 'block';
       const i = HT.indexOf(o.hinhThuc);
       if (i >= 0 && ht < 0) chon(document.querySelector('[data-i="' + i + '"]'));
       if (o.linkHT && !$('l').value) $('l').value = o.linkHT;
       if (!$('n').value) $('n').value = o.nguoi || '';
       if (o.ghiChuGui && !$('g').value) $('g').value = o.ghiChuGui;
     }
   }).catch(() => { $('info').textContent = '(Chưa tải được thông tin đơn – vẫn báo gửi được bình thường)'; });

 // ----- Ảnh: chọn tối đa 3, tự ghép thành 1 ảnh gọn gửi lên nhóm -----
 let anh = [];                                   // các ảnh đã chọn (Image)
 function docAnh(file) {
   return new Promise((ok, loi) => { const r = new FileReader();
     r.onload = () => { const i = new Image(); i.onload = () => ok(i); i.onerror = loi; i.src = r.result; };
     r.onerror = loi; r.readAsDataURL(file); });
 }
 async function themAnh(inp) {
   const fs = Array.from(inp.files || []); inp.value = '';
   for (const f of fs) {
     if (anh.length >= 3) { alert('Tối đa 3 ảnh cho 1 đơn'); break; }
     try { anh.push(await docAnh(f)); } catch (e) { alert('Không đọc được 1 ảnh, bỏ qua ảnh đó'); }
   }
   veThumbs();
 }
 function xoaAnh(i) { anh.splice(i, 1); veThumbs(); }
 function veThumbs() {
   $('thumbs').innerHTML = anh.map((im, i) => '<div><img src="' + im.src + '"><span onclick="xoaAnh(' + i + ')">✕</span></div>').join('');
   $('themAnh').style.display = anh.length >= 3 ? 'none' : 'block';
   $('themAnh').textContent = anh.length ? '📷 Thêm ảnh (' + anh.length + '/3)' : '📷 Chọn ảnh';
 }
 /** Ghép các ảnh nằm cạnh nhau thành 1 ảnh, thu nhỏ còn tối đa 1600px chiều dài -> JPEG base64. */
 function ghepAnh() {
   if (!anh.length) return '';
   const H = Math.min(1200, Math.max.apply(null, anh.map(i => i.height)));
   const ws = anh.map(i => Math.round(i.width * H / i.height)), gap = anh.length > 1 ? 12 : 0;
   let W = ws.reduce((s, w) => s + w, 0) + gap * (anh.length - 1), h = H;
   const k = Math.min(1, 1600 / Math.max(W, h)); W = Math.round(W * k); h = Math.round(h * k);
   const c = document.createElement('canvas'); c.width = W; c.height = h;
   const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, h);
   let x = 0; anh.forEach((im, j) => { const w = Math.round(ws[j] * k); g.drawImage(im, x, 0, w, h); x += w + Math.round(gap * k); });
   return c.toDataURL('image/jpeg', 0.82).split(',')[1];
 }
 function reset() { $('go').disabled = false; $('go').textContent = GO; }

 function huy() {
   const n = $('n').value.trim(); if (!n) { alert('Nhập tên người gửi trước'); return; }
   if (!confirm('Hủy báo gửi đơn ' + D + '? Bot sẽ nhắn sale bỏ qua ảnh/tin trước và đơn quay về "Chưa gửi".')) return;
   $('huy').disabled = true; $('huy').textContent = 'Đang hủy…';
   fetch(EXEC + '?api=gui', { method: 'POST', body: JSON.stringify({ act: 'huy', d: D, t: T, n: n }) })
     .then(r => r.json()).then(o => {
       if (!o.ok) { alert('Lỗi: ' + o.err); $('huy').disabled = false; $('huy').textContent = '↩️ Báo nhầm – hủy xác nhận'; return; }
       $('f').style.display = 'none'; $('ok').firstChild.textContent = '↩️ Đã hủy báo gửi '; $('kq').textContent = o.msg || ''; $('ok').style.display = 'block';
     }).catch(e => { alert('Không gửi được, kiểm tra mạng rồi bấm lại. (' + e.message + ')'); $('huy').disabled = false; $('huy').textContent = '↩️ Báo nhầm – hủy xác nhận'; });
 }

 function gui() {
   if (ht < 0) { alert('Chọn hình thức gửi'); return; }
   const n = $('n').value.trim(); if (!n) { alert('Nhập tên người gửi'); return; }
   try { localStorage.setItem('ten', n); } catch (e) {}
   const l = ht === XE ? $('l').value.trim() : '';
   if (!anh.length && !daGui && !confirm('Chưa chọn ảnh gửi hàng. Vẫn xác nhận?')) return;
   $('go').disabled = true; $('go').textContent = 'Đang lưu…';
   const send = a => fetch(EXEC + '?api=gui', { method: 'POST', body: JSON.stringify({ d: D, t: T, i: ht, n: n, a: a || '', l: l, g: $('g').value.trim() }) })
     .then(r => r.json()).then(o => {
       if (!o.ok) { alert('Lỗi: ' + o.err); reset(); return; }
       $('f').style.display = 'none'; $('kq').textContent = o.msg || ''; $('ok').style.display = 'block';
     }).catch(e => { alert('Không gửi được, kiểm tra mạng rồi bấm lại. (' + e.message + ')'); reset(); });
   send(ghepAnh());
 }
</script>
</body></html>
