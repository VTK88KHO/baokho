<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chụp tem</title>
<style>
 body{font-family:Arial,sans-serif;margin:16px;color:#222;background:#fff}
 h2{margin:0 0 4px;color:#1f4e79;font-size:20px}
 .s{color:#444;margin:3px 0}
 .note{background:#fff3cd;padding:8px;border-radius:8px;margin:10px 0}
 .b{display:block;width:100%;padding:14px;margin:8px 0;font-size:17px;border:1px solid #1f4e79;border-radius:10px;background:#fff;color:#1f4e79}
 #chup{background:#1f4e79;color:#fff;border:none}
 #go{background:#2e7d32;color:#fff;border:none;font-weight:bold;display:none}
 input[type=text]{font-size:17px;padding:11px;width:100%;box-sizing:border-box;margin:4px 0;border:1px solid #aaa;border-radius:8px}
 .tn{display:inline-block;padding:9px 14px;margin:3px;border:1px solid #1f4e79;border-radius:18px;background:#fff;color:#1f4e79;font-size:15px}
 .tn.on{background:#1f4e79;color:#fff}
 #ds{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
 #ds div{position:relative}
 #ds img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid #ccc}
 #ds span{position:absolute;top:-6px;right:-6px;background:#c00;color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;font-size:14px}
 #tt{margin-top:10px;color:#1f4e79;font-weight:bold}
 #bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;display:none;margin-top:6px}
 #bar i{display:block;height:100%;width:40%;background:#2e7d32;animation:chay 1.2s linear infinite}
 @keyframes chay{from{margin-left:-40%}to{margin-left:100%}}
 #ok{display:none;text-align:center;font-size:20px;color:#2e7d32;margin-top:40px}
 #ok small{color:#444;font-size:15px}
 label{display:block;margin:8px 0}
</style>
</head>
<body>
<div id="f">
 <h2 id="tieu">📷 Ảnh tem</h2>
 <div id="thu" class="note" style="display:none">🧪 TRANG THỬ – kết quả gửi về Telegram riêng của chị, không vào nhóm kho.</div>
 <div id="info" class="s"></div>
 <div id="hoi"></div>
 <p><b>Người gửi:</b> <small>(bấm tên của bạn)</small></p>
 <div id="nut"></div>
 <input type="text" id="n" placeholder="Tên bạn">
 <input id="p" type="file" accept="image/*" multiple style="display:none">
 <input id="x" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" multiple style="display:none">
 <button class="b" id="chup">📷 Chụp / chọn ảnh tem</button>
 <button class="b" id="chonfile">📄 Chọn file Excel serial</button>
 <p class="s" style="font-size:13px">Gửi được ảnh tem, ảnh chụp màn hình danh sách serial, hoặc file Excel của phần mềm quét mã – chung 1 lần cũng được.</p>
 <div id="dsf" class="s"></div>
 <div id="ds"></div>
 <button class="b" id="go"></button>
 <div id="tt"></div>
 <div id="bar"><i></i></div>
</div>
<div id="ok">✅ Đã gửi<br><small id="kq"></small><br><br><small>Bạn có thể đóng trang này.</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
// Link do bot tạo: tem.html?d=<số đơn>&t=<mã>&x=<link /exec của bot>[&thu=1]
var Q = new URLSearchParams(location.search);
var D = Q.get('d') || '', T = Q.get('t') || '', THU = Q.get('thu') === '1' ? 1 : 0, EXEC = Q.get('x') || '';
var ds = [], sr = [], tenFile = [], dangGui = false, CO = 0;
var $ = function (id) { return document.getElementById(id); };
$('tieu').textContent = '📷 Ảnh tem · ' + D;
if (THU) $('thu').style.display = 'block';
try { var n0 = localStorage.getItem('tenTem'); if (n0) $('n').value = n0; } catch (e) {}

// Thông tin đơn tải ngầm – trang đã dùng được ngay, không phải chờ
if (!D || !T || !EXEC) { $('info').textContent = 'Link không hợp lệ.'; }
else fetch(EXEC + '?api=teminfo&d=' + encodeURIComponent(D) + '&t=' + encodeURIComponent(T) + (THU ? '&thu=1' : ''))
  .then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) { $('info').textContent = j.err || 'Lỗi'; return; }
    $('info').innerHTML = (j.kho ? '<b>' + esc(j.kho) + '</b> · ' : '') + esc(j.khach || '') + (j.sale ? ' · ' + esc(j.sale) : '');
    if (j.daCo && j.daCo.n) {
      CO = 1;
      $('hoi').innerHTML = '<div class="note"><b>Đơn này đã có ' + j.daCo.n + ' serial</b> (gửi lúc ' + esc(j.daCo.gio || '') + '). Lần này:' +
        '<label><input type="radio" name="cd" value="them"> ➕ <b>Gửi THÊM</b> (giữ serial cũ)</label>' +
        '<label><input type="radio" name="cd" value="lai"> 🔄 <b>Gửi LẠI</b> – lần trước gửi nhầm, HỦY serial cũ</label></div>';
    }
    var ten = j.ten || [];
    $('nut').innerHTML = ten.map(function (x) { return '<button type="button" class="tn">' + esc(x) + '</button>'; }).join('');
    [].forEach.call(document.querySelectorAll('.tn'), function (b) { b.onclick = function () { chonTen(b); }; });
    if (!$('n').value && ten[0]) $('n').value = ten[0];
    danhDauTen();
  }).catch(function () {});

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function chonTen(b) { $('n').value = b.textContent; danhDauTen(); }
function danhDauTen() { var v = $('n').value; [].forEach.call(document.querySelectorAll('.tn'), function (b) { b.classList.toggle('on', b.textContent === v); }); }
$('n').oninput = danhDauTen;
$('chup').onclick = function () { $('p').click(); };
$('chonfile').onclick = function () { $('x').click(); };
$('go').onclick = gui;

// ===== TẢI TRƯỚC: mỗi ảnh tự gửi lên ngay lúc chụp, nên bấm GỬI là xong luôn =====
var B = (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 16);
var soK = 0, hang = [], dangChay = 0, gv = 0, luoiK = '', luoiDung = '', hgLuoi = 0, fk = '', fkDung = '';
var trang = {};   // k -> 0 đang tải, 1 xong, -1 lỗi
function post(o, keep) {
  return fetch(EXEC + '?api=tem', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(o), keepalive: !!keep })
    .then(function (r) { return r.text(); }).then(function (t) { var j = {}; try { j = JSON.parse(t); } catch (e) {} return j; });
}
function tai(k, v) { trang[k] = 0; hang.push({ k: k, v: v, lan: 0 }); bom(); }
function bom() {
  while (dangChay < 3 && hang.length) (function (x) {
    dangChay++;
    post({ act: 'tai', d: D, t: T, thu: THU, id: B, k: x.k, b: x.v }).then(function (j) {
      if (!j.ok) throw new Error(j.err || 'lỗi');
      trang[x.k] = 1; x.v = null;
    }).catch(function () {
      if (++x.lan < 4) { hang.push(x); } else { trang[x.k] = -1; }
    }).then(function () { dangChay--; bom(); kiem(); });
  })(hang.shift());
}
function chuaXong() {
  var ks = ds.map(function (x) { return x.k; }); if (ds.length > 1) ks.push(luoiK || '?'); if (sr.length) ks.push(fk || '?');
  var loi1 = 0, cho = 0;
  ks.forEach(function (k) { var s = trang[k]; if (s === 1) return; if (s === -1) loi1++; else cho++; });
  return { cho: cho, loi: loi1 };
}
// Ảnh lưới (nhiều ảnh -> 1 ảnh) dựng lại sau mỗi lần thêm/bớt ảnh, rồi tải trước luôn
function lamLuoi() {
  clearTimeout(hgLuoi); luoiK = ''; var phien = ++gv;
  if (ds.length < 2) return;
  hgLuoi = setTimeout(function () {
    luoi(function (b) { if (phien !== gv) return; luoiK = 'g' + phien; tai(luoiK, b); });
  }, 500);
}
function lamFile() {
  fk = ''; if (!sr.length) return;
  fk = 'f' + (++soK); tai(fk, JSON.stringify(sr));
}

function ve() {
  var h = '';
  for (var i = 0; i < ds.length; i++) h += '<div><img src="data:image/jpeg;base64,' + ds[i].b + '"><span data-i="' + i + '">✕</span></div>';
  $('ds').innerHTML = h;
  [].forEach.call(document.querySelectorAll('#ds span'), function (s) { s.onclick = function () { if (!dangGui) { ds.splice(+s.getAttribute('data-i'), 1); ve(); lamLuoi(); } }; });
  $('go').style.display = (ds.length || sr.length) ? 'block' : 'none';
  $('go').textContent = '✅ GỬI ' + (ds.length ? ds.length + ' ẢNH' : '') + (ds.length && sr.length ? ' + ' : '') + (sr.length ? sr.length + ' SERIAL TỪ FILE' : '');
  $('dsf').innerHTML = sr.length ? '📄 ' + esc(tenFile.join(', ')) + ': <b>' + sr.length + ' serial</b> <a href="#" id="bof">✕ bỏ</a>' : '';
  if ($('bof')) $('bof').onclick = function () { sr = []; tenFile = []; fk = ''; ve(); return false; };
  $('chup').textContent = ds.length ? '📷 Chụp / chọn thêm ảnh' : '📷 Chụp / chọn ảnh tem';
}
// Nén ảnh ngay trên điện thoại cho gửi nhanh (vẫn đủ rõ để đọc serial)
function nen(file, cb) {
  var r = new FileReader();
  r.onload = function () {
    var i = new Image();
    i.onload = function () {
      var m = 1280, k = Math.min(1, m / Math.max(i.width, i.height));
      var c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k;
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
    };
    i.onerror = function () { cb(''); };
    i.src = r.result;
  };
  r.onerror = function () { cb(''); };
  r.readAsDataURL(file);
}
$('p').onchange = function () {
  var fs = [].slice.call(this.files || []); this.value = ''; var con = fs.length;
  $('tt').textContent = con ? 'Đang xử lý ảnh…' : '';
  fs.forEach(function (f) {
    nen(f, function (b) {
      if (b && ds.length < 30) { var k = 'a' + (++soK); ds.push({ b: b, k: k }); tai(k, b); }
      if (!--con) { $('tt').textContent = ''; ve(); lamLuoi(); }
    });
  });
};
// Ghép nhiều ảnh thành 1 ảnh lưới -> nhóm Zalo chỉ nhận 1 tin
function luoi(cb) {
  var n = ds.length, cot = n <= 4 ? 2 : 3, hang2 = Math.ceil(n / cot), o = n <= 4 ? 760 : 560, g = 8;
  var c = document.createElement('canvas'); c.width = cot * o + (cot + 1) * g; c.height = hang2 * o + (hang2 + 1) * g;
  var x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); var con = n;
  var xong = function () { if (!--con) cb(c.toDataURL('image/jpeg', 0.8).split(',')[1]); };
  ds.forEach(function (it, i) {
    var im = new Image();
    im.onload = function () {
      var k = Math.min(o / im.width, o / im.height), w = im.width * k, h = im.height * k;
      x.drawImage(im, g + (i % cot) * (o + g) + (o - w) / 2, g + Math.floor(i / cot) * (o + g) + (o - h) / 2, w, h); xong();
    };
    im.onerror = xong; im.src = 'data:image/jpeg;base64,' + it.b;
  });
}
// File Excel/CSV: cột A = serial, cột B = model (dòng trống model thì lấy model dòng trên)
$('x').onchange = function () {
  var fs = [].slice.call(this.files || []); this.value = '';
  if (typeof XLSX === 'undefined') { alert('Trang chưa tải xong phần đọc Excel, đợi 2 giây rồi chọn lại.'); return; }
  fs.forEach(function (f) {
    var r = new FileReader();
    r.onload = function (e) {
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }), md = '', dem = 0, co = {};
        sr.forEach(function (x) { co[x.serial] = 1; });
        rows.forEach(function (r) {
          var a = String(r[0] || '').split('|').join('').trim(), b = String(r[1] || '').split('|').join('').trim();
          if (b) md = b;
          if (!a || a.length < 4 || /serial|^s.n$|^stt$|^mã/i.test(a) || co[a]) return;
          co[a] = 1; sr.push({ serial: a, model: md }); dem++;
        });
        tenFile.push(f.name + ' (' + dem + ')'); ve(); lamFile();
        if (!dem) alert('Không thấy serial trong file ' + f.name + ' (serial phải ở cột A).');
      } catch (er) { alert('Không đọc được file ' + f.name + ': ' + er.message); }
    };
    r.readAsArrayBuffer(f);
  });
};
var choChot = null;
function kiem() { if (choChot) choChot(); }
function gui() {
  if (dangGui || (!ds.length && !sr.length)) return;
  var ten = $('n').value.trim(); if (!ten) { alert('Nhập tên người gửi'); return; }
  var cd = 'them';
  if (CO) {
    var c = document.querySelector('input[name=cd]:checked');
    if (!c) { alert('Chọn Gửi THÊM hay Gửi LẠI'); return; }
    cd = c.value;
    if (cd === 'lai' && !confirm('Hủy toàn bộ serial cũ của đơn này và thay bằng lần gửi này?')) return;
  }
  try { localStorage.setItem('tenTem', ten); } catch (e) {}
  dangGui = true; $('go').disabled = true; $('chup').disabled = true; $('chonfile').disabled = true;
  var t0 = Date.now();
  var chot = function () {
    choChot = null;
    var o = { act: 'chot', d: D, t: T, thu: THU, id: B, ks: ds.map(function (x) { return x.k; }), g: ds.length > 1 ? luoiK : '', fk: sr.length ? fk : '', n: ten, cd: cd, t0: t0 };
    // Gửi 1 tin rất nhỏ (vẫn tới máy chủ dù đã đóng trang) rồi báo xong NGAY
    post(o, true).then(function (j) { if (j && j.ok === false) alert('⚠️ Bot báo lỗi: ' + (j.err || '') + '\nBấm lại link để gửi lại.'); }).catch(function () {});
    $('f').style.display = 'none';
    $('kq').textContent = 'Đã nhận ' + (ds.length ? ds.length + ' ảnh' : '') + (ds.length && sr.length ? ' + ' : '') + (sr.length ? sr.length + ' serial từ file' : '') + '. Bot tự ghi serial và đăng vào nhóm.';
    $('ok').style.display = 'block';
  };
  if (ds.length > 1 && !luoiK) { clearTimeout(hgLuoi); var phien = ++gv; luoi(function (b) { if (phien !== gv) return; luoiK = 'g' + phien; tai(luoiK, b); kiem(); }); }
  choChot = function () {
    var x = chuaXong();
    if (x.loi) { choChot = null; return loi('mạng yếu, một số ảnh chưa lên được'); }
    if (!x.cho) chot();
  };
  if (chuaXong().cho) { $('tt').textContent = 'Đang gửi nốt ảnh…'; $('bar').style.display = 'block'; }
  kiem();
}
function loi(m) {
  alert('Chưa gửi được: ' + m + '\nBấm GỬI để thử lại.');
  // ảnh lỗi -> tải lại từ đầu
  ds.forEach(function (x) { if (trang[x.k] !== 1) tai(x.k, x.b); });
  if (ds.length > 1 && trang[luoiK] !== 1) { luoiK = ''; lamLuoi(); }
  if (sr.length && trang[fk] !== 1) lamFile();
  dangGui = false; $('go').disabled = false; $('chup').disabled = false; $('chonfile').disabled = false;
  $('tt').textContent = ''; $('bar').style.display = 'none';
}
</script>
</body>
</html>
